<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Карточка прототипа — телефон</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@600;700;800&family=IBM+Plex+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
body{margin:0;background:#0E1014;color:#E9EBF0;font-family:'IBM Plex Sans',system-ui,sans-serif;font-size:14px;-webkit-font-smoothing:antialiased}
a{color:#7FA7FF}a:hover{color:#A9C3FF}
h1,h2,h3{font-family:'Manrope',sans-serif;margin:0}
.mono{font-family:'JetBrains Mono',monospace}
.pill{display:inline-flex;align-items:center;gap:6px;padding:3px 9px;border-radius:999px;font-size:12px;font-weight:500;white-space:nowrap}
.ok{background:rgba(76,195,138,.14);color:#4CC38A}
.card{background:#171A20;border:1px solid #2A2F39;border-radius:12px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:44px;padding:0 16px;border-radius:10px;font-weight:600;font-size:14px;border:1px solid #2A2F39;background:#1E222A;color:#E9EBF0;font-family:inherit;cursor:pointer}
.btn.primary{background:#7FA7FF;color:#0E1014;border-color:#7FA7FF}
.btn.danger{background:transparent;color:#F26D6D;border-color:#4A2B2B}
.btn.icon{width:44px;padding:0;flex-shrink:0}
.input{height:44px;padding:0 12px;border-radius:10px;border:1px solid #2A2F39;background:#0E1014;color:#E9EBF0;font-family:inherit;font-size:15px;width:100%;box-sizing:border-box}
label{font-size:12px;font-weight:500;color:#A2A9B6}
.switch{appearance:none;-webkit-appearance:none;width:44px;height:26px;border-radius:13px;background:#3A414D;position:relative;margin:0;cursor:pointer;flex-shrink:0}
.switch::after{content:'';position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:10px;background:#E9EBF0}
.switch:checked{background:#4CC38A}
.switch:checked::after{left:21px;background:#0E1014}
</style>
</helmet>
<div style="width: 390px; height: 844px; display: flex; flex-direction: column; overflow: hidden; background: #0E1014">
  <header style="height: 56px; flex-shrink: 0; display: flex; align-items: center; gap: 8px; padding: 0 16px 0 4px; border-bottom: 1px solid #2A2F39">
    <a href="MobilePrototypes.dc.html" aria-label="Назад" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; color: #A2A9B6"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"></path></svg></a>
    <div style="display: flex; flex-direction: column; flex-grow: 1; min-width: 0">
      <h1 style="font-size: 17px; font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap">Дашборд аналитики v3</h1>
      <span style="font-size: 11px; color: #8B93A1">Claude · 22 сен · 1,4 МБ</span>
    </div>
  </header>

  <main style="flex-grow: 1; min-height: 0; overflow: hidden; padding: 16px; display: flex; flex-direction: column; gap: 14px; box-sizing: border-box">
    <div style="height: 110px; border-radius: 10px; background: #171A20; border: 1px solid #2A2F39; display: flex; flex-direction: column; overflow: hidden">
      <div style="height: 20px; background: #1E222A; display: flex; align-items: center; gap: 5px; padding: 0 8px">
        <span style="width: 6px; height: 6px; border-radius: 3px; background: #3A414D"></span><span style="width: 6px; height: 6px; border-radius: 3px; background: #3A414D"></span><span style="width: 6px; height: 6px; border-radius: 3px; background: #3A414D"></span>
      </div>
      <div style="padding: 10px; display: flex; flex-direction: column; gap: 7px">
        <div style="height: 8px; width: 40%; border-radius: 3px; background: #2A2F39"></div>
        <div style="display: flex; gap: 6px"><div style="height: 30px; flex-grow: 1; border-radius: 4px; background: #1E222A"></div><div style="height: 30px; flex-grow: 1; border-radius: 4px; background: #1E222A"></div><div style="height: 30px; flex-grow: 1; border-radius: 4px; background: #1E222A"></div></div>
        <div style="height: 6px; width: 65%; border-radius: 3px; background: #2A2F39"></div>
      </div>
    </div>

    <div style="display: flex; flex-direction: column; gap: 6px">
      <label for="m-pt-link">Публичная ссылка</label>
      <div style="display: flex; gap: 8px">
        <input id="m-pt-link" class="input mono" type="text" value="hub.example.com/p/k3x9pq2m" readonly style="font-size: 13px">
        <button class="btn icon" type="button" aria-label="Скопировать"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg></button>
        <button class="btn icon" type="button" aria-label="Поделиться"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8M16 6l-4-4-4 4M12 2v13"></path></svg></button>
      </div>
    </div>

    <div class="card" style="box-sizing: border-box; padding: 12px 14px; display: flex; flex-direction: column; gap: 10px">
      <div style="display: flex; align-items: center; gap: 12px; min-height: 26px">
        <input type="checkbox" class="switch" checked aria-label="Пинкод включён">
        <span style="font-weight: 500; flex-grow: 1">Пинкод <span class="mono" style="color: #A2A9B6">••••</span></span>
        <button type="button" style="height: 32px; padding: 0 12px; border-radius: 8px; border: 1px solid #2A2F39; background: #1E222A; color: #E9EBF0; font-family: inherit; font-size: 12px; font-weight: 600; cursor: pointer">Сменить</button>
      </div>
      <span style="font-size: 12px; color: #8B93A1">Cookie на 24 ч · 5 попыток за 10 мин · смена сбрасывает cookie</span>
    </div>

    <div style="display: flex; flex-direction: column; gap: 6px">
      <label for="m-pt-exp">Срок жизни</label>
      <select id="m-pt-exp" class="input" style="appearance: none"><option>Бессрочно</option></select>
    </div>

    <div style="display: flex; flex-direction: column; gap: 6px">
      <label>Версии</label>
      <div class="card" style="box-sizing: border-box; padding: 0 14px">
        <div style="display: flex; align-items: center; gap: 8px; min-height: 44px; border-bottom: 1px solid #1F242D"><span class="mono">v3</span><span style="color: #A2A9B6; font-size: 13px">2 ч назад</span><span style="flex-grow: 1"></span><span class="pill ok">текущая</span></div>
        <div style="display: flex; align-items: center; gap: 8px; min-height: 44px; border-bottom: 1px solid #1F242D"><span class="mono">v2</span><span style="color: #A2A9B6; font-size: 13px">вчера</span><span style="flex-grow: 1"></span><a href="#v2" style="font-size: 13px; text-decoration: none">откатить</a></div>
        <div style="display: flex; align-items: center; gap: 8px; min-height: 44px"><span class="mono">v1</span><span style="color: #A2A9B6; font-size: 13px">22 сен</span><span style="flex-grow: 1"></span><a href="#v1" style="font-size: 13px; text-decoration: none">откатить</a></div>
      </div>
    </div>
  </main>

  <div style="flex-shrink: 0; padding: 12px 16px 30px; border-top: 1px solid #2A2F39; background: #121419; display: flex; gap: 10px">
    <button class="btn danger" type="button" style="flex-grow: 1">Удалить</button>
    <button class="btn primary" type="button" style="flex-grow: 2">Сохранить</button>
  </div>
</div>
</x-dc>
